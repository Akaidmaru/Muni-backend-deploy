name: Publish Backend to GHCR

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image and tags
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          BRANCH_TAG="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=$BRANCH_TAG" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Add latest tag on main
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest

      - name: Dispatch deploy production (main)
        if: github.ref_name == 'main'
        env:
          DISPATCH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $DISPATCH_TOKEN" \
            https://api.github.com/repos/LuisaVargas-9/Muni-infra/dispatches \
            -d @- <<EOF
          {
            "event_type": "backend-published",
            "client_payload": {
              "environment": "production",
              "component": "backend",
              "branch": "${{ github.ref_name }}",
              "image": "${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}"
            }
          }
          EOF

      - name: Dispatch deploy dev and test (dev)
        if: github.ref_name == 'dev'
        env:
          DISPATCH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          for TARGET_ENV in dev test; do
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: token $DISPATCH_TOKEN" \
              https://api.github.com/repos/LuisaVargas-9/Muni-infra/dispatches \
              -d @- <<EOF
          {
            "event_type": "backend-published",
            "client_payload": {
              "environment": "${TARGET_ENV}",
              "component": "backend",
              "branch": "${{ github.ref_name }}",
              "image": "${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}"
            }
          }
          EOF
          done
