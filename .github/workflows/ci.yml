# Compila la imagen Docker en cada push/PR. No publica en GHCR ni despliega a servidores.
# Variables de entorno en runtime (DATABASE_URL, JWT, etc.) van en Ansible / EC2, no aquí.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (valida Dockerfile)
        run: docker build -t transport-backend:ci .
