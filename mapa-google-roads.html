<!DOCTYPE html>
<html>
<head>
  <title>Roads API - Trayecto Corto</title>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // 🔐 SOLO AQUÍ defines tu API KEY
    const API_KEY = "AIzaSyBHch8-rBgJh41jc1uCrPqbwHu9DaP-FMM";

    let map;
    let ruta;

    const puntosVehiculo = [
      { lat: 6.15525, lng: -75.37382 },
      { lat: 6.15560, lng: -75.37440 },
      { lat: 6.15600, lng: -75.37510 },
      { lat: 6.15640, lng: -75.37580 },
      { lat: 6.15680, lng: -75.37650 }
    ];

    function initMap() {

      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16,
        center: puntosVehiculo[0]
      });

      ruta = new google.maps.Polyline({
        strokeColor: "#FF0000",
        strokeOpacity: 1,
        strokeWeight: 4
      });

      ruta.setMap(map);

      ajustarACalles();
    }

    function ajustarACalles() {

      fetch('http://localhost:3000/routes/snap-to-roads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ points: puntosVehiculo.map(p => ({ latitude: p.lat, longitude: p.lng })) })
      })
        .then(res => res.json())
        .then(puntosAjustados => {
          if (!Array.isArray(puntosAjustados) || puntosAjustados.length === 0) {
            alert('No hay puntos ajustados en la respuesta');
            return;
          }

          // 🔵 Dibujar puntos originales
          puntosVehiculo.forEach(p => {
            new google.maps.Marker({
              position: p,
              map: map,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 6,
                fillColor: 'blue',
                fillOpacity: 1,
                strokeWeight: 1
              },
              title: 'Original'
            });
          });

          // 🟢 Dibujar puntos ajustados
          puntosAjustados.forEach(p => {
            new google.maps.Marker({
              position: { lat: p.latitude, lng: p.longitude },
              map: map,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 5,
                fillColor: 'green',
                fillOpacity: 1,
                strokeWeight: 1
              },
              title: 'Ajustado'
            });
          });

          // 🔴 Dibujar línea ajustada
          ruta.setPath(puntosAjustados.map(p => ({ lat: p.latitude, lng: p.longitude })));

          const bounds = new google.maps.LatLngBounds();
          puntosAjustados.forEach(p => bounds.extend({ lat: p.latitude, lng: p.longitude }));
          map.fitBounds(bounds);

        })
        .catch(err => {
          console.error(err);
          alert('Error llamando endpoint snap-to-roads');
        });
    }

    window.initMap = initMap;

    // 🔹 Cargar Google Maps dinámicamente usando la misma API_KEY
    function cargarGoogleMaps() {
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    cargarGoogleMaps();
  </script>

</body>
</html>
